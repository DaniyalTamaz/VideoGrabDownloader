name: Deploy SportNexa Admin

on:
  push:
    branches: [main]
    paths:
      - 'sportnexa/admin/**'
      - '.github/workflows/sportnexa-admin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sportnexa-admin-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload SportNexa Admin site
        uses: actions/upload-pages-artifact@v3
        with:
          path: sportnexa/admin

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# GitHub Pages enabled; this commit retriggers deployment.
